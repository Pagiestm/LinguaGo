name: linguago

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-linguago}
    ports:
      - '${DB_PORT:-5435}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@linguago.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5051}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-root}@db:5432/${DB_DATABASE:-linguago}
      CLIENT_URL: http://localhost:${CLIENT_PORT:-5173}
      JWT_SECRET: ${JWT_SECRET:-secret-de-developpement-local-a-remplacer-en-production}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      TSC_WATCHFILE: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: 'true'
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://server:3000
      VITE_USE_POLLING: 'true'
    ports:
      - '${CLIENT_PORT:-5173}:5173'
    volumes:
      - ./client/src:/app/client/src
      - ./client/public:/app/client/public
    depends_on:
      - server

volumes:
  db-data:
  pgadmin-data:
