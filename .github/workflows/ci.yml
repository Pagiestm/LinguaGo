name: Qualité et tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Format, lint, types et build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/linguago
      JWT_SECRET: secret-de-ci-suffisamment-long-pour-passer-la-validation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w server
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  images:
    name: Images Docker
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  tests:
    name: Tests unitaires et API
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: linguago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/linguago_test
      DATABASE_URL_TEST: postgresql://postgres:root@localhost:5432/linguago_test
      JWT_SECRET: secret-de-ci-suffisamment-long-pour-passer-la-validation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w server
      - run: npm run test:cov
      - run: npm run test:e2e -w server
      - run: npm run test:unit
      - uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: server/coverage/
          if-no-files-found: ignore

  e2e:
    name: Parcours navigateur
    needs: tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/linguago
      JWT_SECRET: secret-de-ci-suffisamment-long-pour-passer-la-validation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          if-no-files-found: ignore
